[project]
name = "mindeye3"
version = "0.1.0"
description = "Retrieval-first fMRI decoding scaffold for MindEye3."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mindeye3-train = "mindeye3.cli.train:main"
mindeye3-eval = "mindeye3.cli.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

