seed: 7
output_dir: outputs/v0_synthetic

data:
  name: synthetic
  num_samples: 256
  num_subjects: 4
  fmri_dim: 128
  embedding_dim: 64
  noise_std: 0.05
  train_fraction: 0.8
  batch_size: 32

model:
  hidden_dim: 128
  scene_dim: 64
  dropout: 0.0

training:
  epochs: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  temperature: 0.07
  device: cpu
  log_every: 4

evaluation:
  top_k: [1, 5, 10]

