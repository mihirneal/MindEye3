seed: 7
output_dir: outputs/v2_nsd_multisubject_retrieval

data:
  name: nsd
  root: /teamspace/studios/this_studio/nsd
  subjects: [1, 2, 5, 7]
  beta_space: fsaverage
  beta_version: betas_fithrf_GLMdenoise_RR
  embedding_cache: /teamspace/studios/this_studio/nsd/cache/embeddings/openclip_vitl14_dfn2b_s39b.pt
  max_samples:
  max_cached_sessions: 256
  normalize_fmri: true
  include_missing_data: false
  average_repeats: true
  ncsnr_topk: 20000
  ncsnr_aggregation: mean
  train_fraction: 0.8
  batch_size: 128
  group_batches_by_stimulus: true

model:
  hidden_dim: 4096
  hidden_layers: 2
  scene_dim: 1024
  dropout: 0.6
  subject_embedding_dim: 64

training:
  epochs: 30
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  lr_schedule: cosine
  weight_decay: 0.01
  temperature: 0.07
  retrieval_loss_weight: 1.0
  device: cuda
  log_every: 25
  best_metric: image_brain_to_image_top10

evaluation:
  top_k: [1, 5, 10]
